<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <title>ਪੰਜਾਬੀ ਵਿਆਕਰਨ ਤੇ ਸਪੈੱਲ ਚੈੱਕਰ | Newsroom Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      overflow: hidden;
    }

    header {
      background: #131c2e;
      border: 1px solid #1e293b;
      padding: 12px 18px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 14px;
      overflow: hidden;
    }

    .panel {
      background: #131c2e;
      border: 1px solid #1e293b;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-head {
      padding: 10px 14px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
      font-weight: bold;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea {
      flex: 1;
      background: #0b0f19;
      border: none;
      padding: 16px;
      color: #fff;
      font-size: 16px;
      line-height: 1.7;
      resize: none;
      outline: none;
      font-family: inherit;
    }

    .suggestions-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .error-card {
      background: #0b0f19;
      border: 1px solid #334155;
      padding: 10px 12px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .error-card.spelling { border-left: 4px solid #ef4444; }
    .error-card.grammar { border-left: 4px solid #f59e0b; }
    .error-card.style { border-left: 4px solid #a855f7; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .tag.spelling { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .tag.grammar { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .tag.style { background: rgba(168, 85, 247, 0.2); color: #c084fc; }

    .err-words {
      font-size: 15px;
    }

    .err-text {
      color: #f87171;
      text-decoration: line-through;
      font-weight: bold;
    }

    .sugg-text {
      color: #34d399;
      font-weight: bold;
      margin-left: 6px;
    }

    .desc {
      font-size: 12px;
      color: #94a3b8;
    }

    .btn-fix {
      align-self: flex-end;
      background: #059669;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-fix:hover { background: #047857; }

    .action-bar {
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
    }

    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-green { background: #16a34a; }
    .btn-green:hover { background: #15803d; }
    .btn-check { background: #d97706; }

    .stats {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">✍️ ਪੰਜਾਬੀ ਵਿਆਕਰਨ (Grammar) ਤੇ ਸ਼ਬਦ-ਜੋੜ ਚੈੱਕਰ</div>
    <div class="stats" id="statsDisplay">ਸਥਿਤੀ: ਤਿਆਰ</div>
  </header>

  <div class="workspace">
    <div class="panel">
      <div class="panel-head">
        <span>ਖ਼ਬਰ / ਸਕ੍ਰਿਪਟ ਇੱਥੇ ਪੇਸਟ ਕਰੋ</span>
        <button class="btn" style="padding: 2px 8px; font-size: 11px; background: #334155;" onclick="clearAll()">ਸਾਫ਼ ਕਰੋ</button>
      </div>
      <textarea id="inputText" placeholder="ਇੱਥੇ ਪੰਜਾਬੀ ਟੈਕਸਟ ਲਿਖੋ... (ਉਦਾਹਰਣ: ਸਰਕਾਰ ਨੇ ਫੈਸਲਾ ਲਿਆ ਪਰ ਪੁਲਿਸ ਨੇ ਲੋਕਾਂ ਨੂੰ ਗ੍ਰਿਫਤਾਰ ਕੀਤਾ ਗਿਆ ਸੀ। ਉਹ ਪਾਣੀ ਪੀਤਾ।)"></textarea>
      <div class="action-bar">
        <button class="btn btn-check" onclick="runCheck()">🔍 ਵਿਆਕਰਨ ਤੇ ਸਪੈੱਲ ਚੈੱਕ ਕਰੋ</button>
        <button class="btn btn-green" onclick="fixAllErrors()">⚡ ਸਾਰੀਆਂ ਗ਼ਲਤੀਆਂ ਠੀਕ ਕਰੋ</button>
        <button class="btn" style="background:#475569;" onclick="copyText()">ਕਾਪੀ ਕਰੋ</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span>ਲੱਭੀਆਂ ਗਈਆਂ ਗ਼ਲਤੀਆਂ ਤੇ ਵਿਆਕਰਨ ਸੁਝਾਅ</span>
      </div>
      <div class="suggestions-list" id="suggestionsBox">
        <div style="color: #64748b; text-align: center; margin-top: 40px;">ਚੈੱਕ ਕਰਨ ਲਈ ਬਟਨ ਦਬਾਓ ਜਾਂ ਟੈਕਸਟ ਲਿਖੋ।</div>
      </div>
    </div>
  </div>
