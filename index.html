<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <title>AI Punjabi Grammar & Spell Corrector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      overflow: hidden;
    }

    header {
      background: #111827;
      border: 1px solid #1f2937;
      padding: 12px 18px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid #059669;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      overflow: hidden;
    }

    .panel {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-head {
      padding: 10px 14px;
      background: #030712;
      border-bottom: 1px solid #1f2937;
      font-size: 13px;
      font-weight: bold;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea {
      flex: 1;
      background: #090d16;
      border: none;
      padding: 16px;
      color: #fff;
      font-size: 16px;
      line-height: 1.8;
      resize: none;
      outline: none;
      font-family: inherit;
    }

    .output-box {
      flex: 1;
      background: #090d16;
      padding: 16px;
      color: #34d399;
      font-size: 16px;
      line-height: 1.8;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #030712;
      border-top: 1px solid #1f2937;
    }

    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-ai { background: #7c3aed; }
    .btn-ai:hover { background: #6d28d9; }

    #loadingText {
      display: none;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 500;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>✨ Gemini AI ਪੰਜਾਬੀ ਵਿਆਕਰਨ ਤੇ ਸਪੈੱਲ ਸੁਧਾਰਕ (Newsroom Desk)</span>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span>AI ਇੰਜਣ ਕਨੈਕਟਡ</span>
    </div>
  </header>

  <div class="workspace">
    <div class="panel">
      <div class="panel-head">
        <span>ਅਸਲ ਖ਼ਬਰ / ਸਕ੍ਰਿਪਟ (ਜਿਸ ਨੂੰ ਠੀਕ ਕਰਨਾ ਹੈ)</span>
        <button class="btn" style="padding: 2px 8px; font-size: 11px; background: #374151;" onclick="document.getElementById('inputText').value=''">ਸਾਫ਼ ਕਰੋ</button>
      </div>
      <textarea id="inputText" placeholder="ਇੱਥੇ ਪੰਜਾਬੀ ਟੈਕਸਟ ਲਿਖੋ ਜਾਂ ਪੇਸਟ ਕਰੋ...&#10;&#10;ਜਿਵੇਂ: ਮੁਖ ਮੰਤਰੀ ਨੇ ਫੈਸਲਾ ਲਿਆ ਪਰ ਪੁਲਿਸ ਨੇ ਓਹਨਾ ਨੂੰ ਗ੍ਰਿਫਤਾਰ ਕੀਤਾ
