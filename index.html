  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    header {
      background: #111827;

    .brand {

      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
    }

    .panel {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 8px;
      display: flex;
      flex-direction: column;

      padding: 12px 16px;
      background: #0f172a;

      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }

    textarea {
      width: 100%;
      height: 380px;
      background: #030712;
      border: 1px solid #1e293b;
      border-radius: 6px;
      margin: 12px;
      width: calc(100% - 24px);
      padding: 14px;
      color: #fff;
      font-size: 16px;
      line-height: 1.8;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    .output-box {
      width: calc(100% - 24px);
      height: 380px;
      background: #030712;
      border: 1px solid #1e293b;
      border-radius: 6px;
      margin: 12px;
      padding: 14px;
      color: #34d399;
      font-size: 16px;
      line-height: 1.8;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      margin-top: auto;
    }

    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-ai { background: #7c3aed; }
    .btn-ai:hover { background: #6d28d9; }

    #loadingText {
      display: none;
      color: #38bdf8;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
