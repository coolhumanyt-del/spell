<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <title>AI Punjabi Grammar & Spell Corrector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100vh;
    }

    header {
      background: #111827;
      border: 1px solid #1f2937;
      padding: 12px 20px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { font-size: 16px; font-weight: bold; color: #38bdf8; }

    .status-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid #059669;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .controls-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #111827;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #1f2937;
    }

    .btn {
      background: #7c3aed;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn:hover { background: #6d28d9; }
    .btn-copy { background: #059669; }
    .btn-copy:hover { background: #047857; }
    .btn-clear { background: #374151; padding: 5px 12px; font-size: 12px; }

    #statusMsg {
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
    }

    .box-container {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      height: 600px;
    }

    .box-head {
      padding: 10px 14px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
      font-weight: bold;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }

    textarea {
      flex: 1;
      background: #030712;
      border: none;
      padding: 16px;
      color: #fff;
      font-size: 16px;
      line-height: 1.8;
      resize: none;
      outline: none;
      font-family: inherit;
    }

    .output-area {
      flex: 1;
      background: #030712;
      padding: 16px;
      color: #34d399;
      font-size: 16px;
      line-height: 1.8;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">✨ Gemini AI ਪੰਜਾਬੀ ਵਿਆਕਰਨ ਤੇ ਸਪੈੱਲ ਸੁਧਾਰਕ</div>
    <div class="status-badge">● API ਕਨੈਕਟਡ</div>
  </header>

  <div class="controls-bar">
    <button class="btn" id="runBtn" onclick="runCorrection()">
      ✨ AI ਨਾਲ ਸ਼ੁੱਧ ਕਰੋ
    </button>
    <button class="btn btn-copy" onclick="copyOutput()">ਕਾਪੀ ਕਰੋ</button>
    <span id="statusMsg"></span>
  </div>

  <div class="workspace">
    <!-- ਖੱਬਾ ਪਾਸਾ -->
    <div class="box-container">
      <div class="box-head">
        <span>ਅਸਲ ਸਕ੍ਰਿਪਟ (ਜਿਸ ਨੂੰ ਠੀਕ ਕਰਨਾ ਹੈ)</span>
        <button class="btn btn-clear" onclick="document.getElementById('inputBox').value=''">ਸਾਫ਼ ਕਰੋ</button>
      </div>
      <textarea id="inputBox" placeholder="ਇੱਥੇ ਪੰਜਾਬੀ ਸਕ੍ਰਿਪਟ ਪੇਸਟ ਕਰੋ..."></textarea>
    </div>

    <!-- ਸੱਜਾ ਪਾਸਾ -->
    <div class="box-container">
      <div class="box-head">
        <span>ਸ਼ੁੱਧ ਕੀਤੀ ਗਈ ਪੰਜਾਬੀ</span>
      </div>
      <div class="output-area" id="outputBox">ਨਤੀਜਾ ਇੱਥੇ ਦਿਖਾਈ ਦੇਵੇਗਾ...</div>
    </div>
  </div>

<script>
  // ਤੁਹਾਡੀ ਨਵੀਂ API Key ਸਿੱਧੀ ਸ਼ਾਮਲ ਕੀਤੀ ਗਈ ਹੈ
  const KEY_TOKEN = "AQ.Ab8RN6LyxBb0WzCRlhHnXXN-imAdECrD9HhraL4FR9E8JHVDFw";

  async function runCorrection() {
    const text = document.getElementById('inputBox').value.trim();
    const status = document.getElementById('statusMsg');
    const output = document.getElementById('outputBox');
    const btn = document.getElementById('runBtn');

    if (!text) {
      alert("ਕਿਰਪਾ ਕਰਕੇ ਪਹਿਲਾਂ ਕੋਈ ਪੰਜਾਬੀ ਟੈਕਸਟ ਪੇਸਟ ਕਰੋ!");
      return;
    }

    status.innerText = "⏳ Gemini ਵਿਆਕਰਨ ਤੇ ਸਪੈੱਲ ਚੈੱਕ ਕਰ ਰਿਹਾ ਹੈ...";
    status.style.color = "#38bdf8";
    btn.disabled = true;
    output.innerText = "ਪ੍ਰੋਸੈਸਿੰਗ ਹੋ ਰਹੀ ਹੈ...";

    const prompt = `ਤੁਸੀਂ ਪੰਜਾਬੀ ਨਿਊਜ਼ਰੂਮ ਦੇ ਸੀਨੀਅਰ ਐਡੀਟਰ ਹੋ। ਹੇਠਾਂ ਦਿੱਤੇ ਗਏ ਪੰਜਾਬੀ ਟੈਕਸਟ ਦੇ ਸ਼ਬਦ-ਜੋੜ (Spelling), ਵਿਆਕਰਨ (Grammar), ਕਾਰਕ ਚਿੰਨ੍ਹ ਅਤੇ ਵਾਕ-ਬਣਤਰ ਨੂੰ ਬਿਲਕੁਲ ਸ਼ੁੱਧ ਕਰੋ। ਇਤਿਹਾਸਕ ਅਤੇ ਧਾਰਮਿਕ ਸ਼ਬਦਾਵਲੀ ਦੀ ਮਰਿਆਦਾ ਕਾਇਮ ਰੱਖੋ।
ਸਖ਼ਤ ਹਦਾਇਤ: ਸਿਰਫ਼ ਅਤੇ ਸਿਰਫ਼ ਸ਼ੁੱਧ ਕੀਤਾ ਗਿਆ ਪੰਜਾਬੀ ਟੈਕਸਟ ਹੀ ਲਿਖੋ। ਕੋਈ ਵਾਧੂ ਜਾਣ-ਪਛਾਣ, ਨੋਟ ਜਾਂ ਵਿਆਖਿਆ ਨਾ ਦਿਓ।

ਅਸਲ ਟੈਕਸਟ:
${text}`;

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY_TOKEN}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      const data = await res.json();

      if (data.error) {
        output.innerText = "❌ ਗ਼ਲਤੀ: " + data.error.message;
        status.innerText = "ਅਸਫ਼ਲ ਰਿਹਾ";
        status.style.color = "#ef4444";
      } else {
        const resText = data.candidates[0].content.parts[0].text.trim();
        output.innerText = resText;
        status.innerText = "✅ ਸਫ਼ਲਤਾਪੂਰਵਕ ਸ਼ੁੱਧ ਕੀਤਾ ਗਿਆ!";
        status.style.color = "#10b981";
      }
    } catch (err) {
      output.innerText = "❌ ਕਨੈਕਸ਼ਨ ਗ਼ਲਤੀ: " + err.message;
      status.innerText = "ਗ਼ਲਤੀ ਆਈ";
      status.style.color = "#ef4444";
    } finally {
      btn.disabled = false;
    }
  }

  function copyOutput() {
    const text = document.getElementById('outputBox').innerText;
    if (!text || text.startsWith("ਨਤੀਜਾ") || text.startsWith("❌")) return;
    navigator.clipboard.writeText(text).then(() => alert("ਸ਼ੁੱਧ ਪੰਜਾਬੀ ਕਾਪੀ ਹੋ ਗਈ!"));
  }
</script>
</body>
</html>
